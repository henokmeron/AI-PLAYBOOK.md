# Model registry
# Tracks candidate, approved, production and retired models.
# Large model weights are NEVER stored in GitHub.

schema_version: 2

# First-release production default: Qwen3.5-27B (isolated live+RAG validated).
# Gemma remains a selectable alternative when its runtime is loaded.
production: qwen3.5-27b

defaults:
  active_model_id: qwen3.5-27b
  # Only one GPU model process at a time on the current single-GPU Pod.
  concurrent_gpu_models: false
  # Explicit client model ids are never silently swapped to another model.
  silent_model_fallback: false

candidates:
  - id: gemma-4-31b-it
    family: google-gemma-4
    huggingface_id: google/gemma-4-31B-it
    source: https://huggingface.co/google/gemma-4-31B-it
    provider: Google DeepMind
    origin: Western
    status: prototype-baseline
    license: Apache-2.0
    modalities:
      - text
      - image
    notes: "First practical open-weight baseline for the platform. Remains the default until Qwen is validated and approved."
    weight_storage: external
    evaluation_status: smoke-passed-broader-pending
    selection_eligible: true
    runpod_path: /workspace/gemma-4-31B-it/gemma-4-31B-it/gemma-4-31B-it
    azure_blob_prefix: models/gemma-4-31B-it
    serving:
      runtime_profile: gemma-vllm-0.31
      listen_host: 127.0.0.1
      listen_port: 8000
      max_model_len: 8192
      gpu_memory_utilization: 0.90
      openai_model_id_env: PLATFORM_MODEL_ID
    hardware:
      precision: bf16
      min_vram_gb: 80
      validated_gpu: NVIDIA H100 NVL 94GB
      observed_gpu_2026_10_13: NVIDIA A100 80GB PCIe
    capabilities:
      chat: verified
      document_qa: verified
      vision: untested
      tool_calling: untested
    task_routing:
      chat: preferred-default
      coding: eligible
      document_questions: preferred-default

  - id: qwen3.5-27b
    family: qwen3.5
    huggingface_id: Qwen/Qwen3.5-27B
    source: https://huggingface.co/Qwen/Qwen3.5-27B
    provider: Alibaba / Qwen
    origin: China
    status: first-release-primary
    license: Apache-2.0
    revision: fc05daec18b0a78c049392ed2e771dde82bdf654
    modalities:
      - text
      - image
    notes: >
      Dense 27B multimodal model with gated delta hybrid attention and native
      262K context. Official card requires a current/nightly vLLM build for
      Qwen3.5. Do not load alongside Gemma on one GPU. First-release primary
      after isolated live chat + Document Q&A on A100 80GB (2026-10-13).
      Multimodal/tool-calling still untested.
    weight_storage: external
    evaluation_status: first-release-primary-2026-10-13
    selection_eligible: true
    runpod_path: /workspace/models/Qwen3.5-27B/fc05daec18b0a78c049392ed2e771dde82bdf654
    azure_blob_prefix: models/Qwen3.5-27B/fc05daec18b0a78c049392ed2e771dde82bdf654
    serving:
      runtime_profile: qwen-vllm-nightly-isolated
      listen_host: 127.0.0.1
      listen_port: 8002
      max_model_len: 8192
      gpu_memory_utilization: 0.90
      reasoning_parser: qwen3
      language_model_only: true
      extra_args:
        - --trust-remote-code
        - --default-chat-template-kwargs
        - '{"enable_thinking": false}'
    hardware:
      precision: bf16
      weights_vram_gb_approx: 51
      recipe_bf16: 1x H200 or 2x H100; H100 NVL 94GB is expected to fit with limited context
      recipe_fp8: single ~40GB GPU (alternate checkpoint Qwen/Qwen3.5-27B-FP8)
      recipe_int4: single ~24GB GPU (alternate quantized checkpoint)
      observed_gpu_2026_10_13: NVIDIA A100 80GB PCIe (~71 GiB used at serve)
    capabilities:
      chat: verified-isolated
      vision: untested
      tool_calling: untested
      reasoning_parser: configured
      document_qa: not-live-tested-on-main
    task_routing:
      chat: eligible-isolated
      coding: eligible-isolated
      document_questions: eligible-isolated-untested-on-main
    known_requirements:
      vllm: "Official model card: install vLLM from main/nightly in a fresh environment; recipe pages cite >=0.17.0. Do not upgrade the Gemma /tmp/vllm-clean-env in place."
      cuda: >
        Current vLLM wheels link libcudart.so.13 and require an NVIDIA driver that
        supports CUDA 13 (~580+). Driver 570 / CUDA 12.8 hosts fail at engine start
        with cudaHostGetDevicePointer / insufficient driver. Redeploy on a newer
        driver host with the same Global Volume; do not expect the cu130 archives
        alone to fix a 570 host.

  - id: mistral-large-4
    family: mistral-large-4
    source: https://mistral.ai/news/mistral-large-4/
    provider: Mistral AI
    origin: France / EU
    status: awaiting-public-weights
    license: pending-verification-at-weight-release
    modalities:
      - text
      - image
    notes: "Leading candidate to evaluate when public weights are released."
    weight_storage: external
    evaluation_status: not-started
    selection_eligible: false

  - id: llama-4
    family: meta-llama-4
    source: https://huggingface.co/meta-llama
    provider: Meta
    origin: US / EU
    status: benchmark-candidate
    license: Llama-4-Community-License
    modalities:
      - text
      - image
    notes: "Keep as a comparison model; licence is not Apache/MIT and must be reviewed before commercial distribution."
    weight_storage: external
    evaluation_status: not-started
    selection_eligible: false

runtime_profiles:
  gemma-vllm-0.31:
    description: Existing pinned Gemma serving environment; do not mutate for Qwen.
    python_env: /tmp/vllm-clean-env
    archive: /workspace/runtime-setup/vllm-clean-env.tar.zst
    vllm_version_observed: "0.31.0"
    notes: Shared by main stack :8000/:8010/:8080.

  qwen-vllm-nightly-isolated:
    description: Isolated Qwen3.5 environment; never extracts over the Gemma env.
    python_env: /tmp/vllm-qwen-env
    install_hint: >
      uv venv /tmp/vllm-qwen-env && source /tmp/vllm-qwen-env/bin/activate &&
      uv pip install -U vllm --torch-backend=auto --extra-index-url https://wheels.vllm.ai/nightly
    persist_plan: /workspace/runtime-setup/qwen-vllm
    archive: /workspace/runtime-setup/qwen-vllm/vllm-qwen-env.tar.zst
    archive_status: checksum-verified-2026-10-13
    notes: >
      Archive present on Global Volume. Restore with ops/restore-qwen-runtime.sh when
      /tmp/vllm-qwen-env is absent. Needs LD_LIBRARY_PATH for nvidia cu13 libs at serve time.
      Do not replace Gemma env.

selection_policy:
  prefer:
    - strong general reasoning
    - coding
    - tool/function calling
    - multimodal capability
    - long context
    - commercial usability
    - documented model provenance
    - strong security posture
    - practical inference cost
  do_not_select_only_on:
    - benchmark scores
    - parameter count
    - popularity
  required_checks:
    - license
    - provenance
    - model security
    - dependency security
    - intended-use restrictions
    - UK/EU commercial deployment implications
    - evaluation against our own tests
  switching_rules:
    - First release defaults to Qwen3.5-27B; Gemma remains selectable when its runtime is loaded.
    - On a single GPU Pod, stop the active model before starting the other; never load both.
    - Main first-release stack: Qwen :8002 + gateway :8010 + console :8080 (see ops/start-first-release.sh).
    - Use ops/switch-gpu-model.sh for an explicit stop/start switch; gateways do not silently remap across runtimes.
    - If the client names a model whose listen_port is not this gateway's upstream, return a clear error (no silent fallback).
  cost_notes:
    - GPU compute dominates cost while a model is loaded; stop the Pod or unload when idle.
    - Weights on Global Volume are persistent storage cost, separate from GPU hours.
    - Do not claim relative cost/quality between Gemma and Qwen without comparable timed tests.
