name: Verify and package main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test release recovery and build checksum-pinned archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact published commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test release archive safety and recovery
        run: python -m unittest ops.test_release_package

      - name: Build versioned source archive and manifest
        run: python -m ops.release.make_release --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/releases"

      - name: Publish release archive and manifest as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-PLAYBOOK-${{ github.sha }}
          path: ${{ runner.temp }}/releases/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 90
