openapi: 3.1.0
info:
  title: Local Business AI Prototype API
  version: 0.3.0
  description: >
    Development-only, loopback-bound API for vLLM chat completion, document-grounded
    question answering, and collection-scoped document management. Not for public
    or production exposure.
servers:
  - url: http://127.0.0.1:8010
    description: Local RunPod Pod only
security:
  - BearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check whether the vLLM upstream is reachable
      responses:
        "200":
          description: Upstream is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  upstream: { type: string, const: ok }
                  model_count: { type: integer }
        "503": { description: Upstream unavailable }
  /v1/chat/completions:
    post:
      summary: Proxy a non-streaming OpenAI-compatible chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string }
                messages: { type: array, items: { type: object } }
                temperature: { type: number }
                max_tokens: { type: integer }
                stream: { type: boolean, default: false }
      responses:
        "200": { description: vLLM completion response }
        "400": { description: Invalid request or streaming requested }
        "401": { description: Authentication required }
        "413": { description: Request body too large }
        "429": { description: Rate limit exceeded }
        "502": { description: Inference upstream unavailable }
  /v1/rag/ask:
    post:
      summary: Answer a question using the demo corpus or a selected managed collection
      description: >
        Retrieves relevant chunks from the demo corpus by default. A request may
        specify a validated collection slug to search only that managed collection.
        BM25 thresholds require corpus-specific calibration; the demo threshold is
        not a universal setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                collection: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
                top_k: { type: integer, minimum: 1, maximum: 10, default: 4 }
      responses:
        "200": { description: Answer or explicit abstention }
        "400": { description: Invalid question, collection or top_k }
        "401": { description: Authentication required }
        "404": { description: Managed collection not found }
        "413": { description: Request body or question too large }
        "429": { description: Rate limit exceeded }
        "500": { description: Document retrieval unavailable }
        "502": { description: Inference upstream unavailable }
  /v1/rag/documents:
    get:
      summary: List documents in one managed collection
      parameters:
        - name: collection
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
      responses:
        "200":
          description: Document metadata without document contents
          content:
            application/json:
              schema:
                type: object
                required: [collection, documents]
                properties:
                  collection: { type: string }
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        size_bytes: { type: integer }
                        extension: { type: string }
        "400": { description: Invalid or missing collection }
        "401": { description: Authentication required }
        "429": { description: Rate limit exceeded }
    post:
      summary: Upload a supported document to a managed collection
      description: >
        Send file bytes as base64. The decoded file is limited to 10 MiB. Collection
        and filename validation block path traversal; overwrite is false by default.
        This is local prototype storage, not a multi-tenant production document service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, filename, content_base64]
              properties:
                collection: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
                filename: { type: string, maxLength: 120 }
                content_base64: { type: string, format: byte }
                overwrite: { type: boolean, default: false }
      responses:
        "201": { description: Document stored }
        "400": { description: Invalid upload or filename }
        "401": { description: Authentication required }
        "409": { description: File already exists and overwrite was not set }
        "413": { description: Upload too large }
        "429": { description: Rate limit exceeded }
    delete:
      summary: Delete one document from a managed collection
      parameters:
        - name: collection
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
        - name: filename
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200": { description: Document deleted }
        "400": { description: Invalid collection or filename }
        "401": { description: Authentication required }
        "404": { description: Document not found }
        "429": { description: Rate limit exceeded }
  /v1/rag/documents:
    get:
      summary: List documents in one managed collection
      parameters:
        - name: collection
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
      responses:
        "200":
          description: Document metadata only, without document content
          content:
            application/json:
              schema:
                type: object
                required: [collection, documents]
                properties:
                  collection: { type: string }
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        size_bytes: { type: integer }
                        extension: { type: string }
        "400": { description: Invalid or missing collection }
        "401": { description: Authentication required }
        "429": { description: Rate limit exceeded }
    post:
      summary: Upload a document to a managed collection
      description: >
        Base64-encoded file bytes, at most 10 MiB after decoding. Supports txt,
        md, csv, html, htm, docx, searchable pdf, and xlsx. Path-traversal names
        are rejected and duplicate files return 409 unless overwrite is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, filename, content_base64]
              properties:
                collection: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
                filename: { type: string, maxLength: 120 }
                content_base64: { type: string, format: byte }
                overwrite: { type: boolean, default: false }
      responses:
        "201": { description: Document stored after content validation }
        "400": { description: Invalid upload or unsupported document }
        "401": { description: Authentication required }
        "409": { description: Document already exists and overwrite was not requested }
        "413": { description: Upload too large }
        "429": { description: Rate limit exceeded }
    delete:
      summary: Delete one document from a managed collection
      parameters:
        - name: collection
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$" }
        - name: filename
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200": { description: Document deleted }
        "400": { description: Invalid collection or filename }
        "401": { description: Authentication required }
        "404": { description: Document not found }
        "429": { description: Rate limit exceeded }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
